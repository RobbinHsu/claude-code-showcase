name: Scheduled - Code Quality Review

on:
  schedule:
    # 每週日 08:00 UTC 執行
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      num_dirs:
        description: '要 review 的隨機 directories 數量'
        required: false
        default: '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  select-directories:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.select.outputs.directories }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 選擇隨機 directories
        id: select
        run: |
          NUM_DIRS="${{ github.event.inputs.num_dirs || '3' }}"

          # 找出 src 中含 TypeScript files 的 directories
          DIRS=$(find src -type d -exec sh -c 'ls "$1"/*.ts "$1"/*.tsx 2>/dev/null | grep -v -E "\.(test|spec|stories)\." | head -1' _ {} \; 2>/dev/null | \
            xargs -I {} dirname {} | \
            sort -u | \
            shuf -n "$NUM_DIRS")

          if [ -z "$DIRS" ]; then
            echo "沒有找到合適的 directories"
            echo "directories=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 轉成 JSON array
          JSON_DIRS=$(echo "$DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "directories=$JSON_DIRS" >> $GITHUB_OUTPUT
          echo "選到的 directories："
          echo "$DIRS"

  review-directory:
    needs: select-directories
    if: needs.select-directories.outputs.directories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        directory: ${{ fromJson(needs.select-directories.outputs.directories) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate branch name
        id: branch
        run: |
          DIR_SLUG=$(echo "${{ matrix.directory }}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-30)
          BRANCH_NAME="claude/code-quality-${DIR_SLUG}-$(date +%Y%m%d)"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Claude Code Quality Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 45
          base_branch: main
          branch_prefix: claude/code-quality-
          track_progress: true
          prompt: |
            # 每週 Code Quality Review

            你正在對特定 directory 執行排程的 code quality review。

            ## 目標 Directory
            **Review：`${{ matrix.directory }}`**

            ## 你的任務

            1. **讀取 code review standards**：讀取 `.claude/agents/code-reviewer.md` 取得完整 checklist

            2. **分析 directory 中所有 files**：
               - 列出所有 .ts 與 .tsx files（排除 .test.、.spec.、.stories.）
               - 完整閱讀每個 file
               - 套用 review checklist

            3. **聚焦找出並修正 issues**：
               - TypeScript strict mode violations（any types、missing types）
               - React anti-patterns（bad useEffect、unnecessary memoization）
               - Code style issues（mutations、deep nesting、poor naming）
               - Missing error handling
               - Security issues
               - Performance problems

            4. **自行修正**：
               - 不只回報 issues，直接修正
               - 使用 Edit tool 更新 files
               - 確保 fixes 不會破壞功能

            5. **執行驗證**：
               - `npm run lint` - 確認沒有新增 lint errors
               - 如果有 errors，修正或 revert changes

            6. **如果有 fixes 就建立 PR**：
               - 從 main 建立 branch
               - Commit 所有 fixes
               - PR title："fix(${{ matrix.directory }}): code quality improvements"
               - PR body 列出套用的 fixes

            ## Guidelines
            - 完整檢查，但只聚焦這個 directory
            - 只修明確的改善
            - 不要只為 style refactor 正常 code
            - 如果沒找到 issues，回報結果並略過 PR
          claude_args: |
            --max-turns 35
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm run lint*)"

  report-completion:
    needs: [select-directories, review-directory]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Code Quality Review 完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reviewed directories：" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.select-directories.outputs.directories }}' | jq -r '.[]' | while read dir; do
            echo "- \`$dir\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "請檢查此 workflow 建立的 PR。" >> $GITHUB_STEP_SUMMARY
