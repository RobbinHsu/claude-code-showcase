name: Scheduled - Dependency Audit

on:
  schedule:
    # 每兩週執行一次（每月 1 日與 15 日）10:00 UTC
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 檢查 outdated dependencies
        id: check-outdated
        run: |
          echo "正在檢查 outdated dependencies..."
          npm outdated --json > /tmp/outdated.json 2>/dev/null || true

          if [ ! -s /tmp/outdated.json ] || [ "$(cat /tmp/outdated.json)" = "{}" ]; then
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "沒有找到 outdated dependencies"
          else
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            echo "找到 outdated dependencies"
            cat /tmp/outdated.json
          fi

      - name: 執行 security audit
        id: security-audit
        run: |
          echo "正在執行 security audit..."
          npm audit --json > /tmp/audit.json 2>/dev/null || true

          if [ -s /tmp/audit.json ]; then
            VULNERABILITIES=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('total',0))" 2>/dev/null || echo "0")
            echo "vulnerabilities=$VULNERABILITIES" >> $GITHUB_OUTPUT
            echo "找到 $VULNERABILITIES 個 vulnerabilities"
          else
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi

      - name: Claude Dependency Analysis & Update
        if: steps.check-outdated.outputs.has_outdated == 'true' || steps.security-audit.outputs.vulnerabilities != '0'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 45
          base_branch: main
          branch_prefix: claude/deps-update-
          track_progress: true
          prompt: |
            # Dependency Audit

            你正在執行排程的 dependency audit。

            ## 你的任務

            1. **分析 outdated packages**：執行 `npm outdated` 並 review 結果

            2. **分析 security vulnerabilities**：執行 `npm audit` 並 review 結果

            3. **安全更新 packages**：
               - Minor/patch updates 使用 `npm update {package}`
               - Major versions 只有確認安全時才使用 `npm install {package}@latest`
               - Security fixes 使用 `npm audit fix`

            4. **驗證 updates**：
               - 執行 `npm run lint` 檢查 issues
               - 執行 `npm test` 確認 tests 通過
               - 有任何 failure，就 revert 該項 update

            5. **如果有 updates 就建立 PR**：
               - 從 main 建立 branch
               - Commit package.json 與 package-lock.json changes
               - PR title："chore(deps): update dependencies"
               - PR body 應列出：
                 - 每個 package 的 old → new version
                 - 修正的 security vulnerabilities（若有）

            ## Guidelines
            - 保守處理，有疑慮就不要更新
            - Update 後 tests 失敗就 revert 該 update
            - Related updates 可一起處理
            - 如果沒有可安全更新的內容，回報並不要建立 PR
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*)"

      - name: 回報不需要 updates
        if: steps.check-outdated.outputs.has_outdated == 'false' && steps.security-audit.outputs.vulnerabilities == '0'
        run: |
          echo "所有 dependencies 都是最新，且沒有 security vulnerabilities。"
          echo "不需要 action。"
