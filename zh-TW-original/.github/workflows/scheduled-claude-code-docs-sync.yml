name: Scheduled - Documentation Sync

on:
  schedule:
    # 每月 1 日 09:00 UTC 執行
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: '往回查看 changes 的天數'
        required: false
        default: '30'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 檢查期間內的 code changes
        id: check-changes
        run: |
          DAYS_BACK="${{ github.event.inputs.days_back || '30' }}"
          SINCE_DATE=$(date -d "-${DAYS_BACK} days" +%Y-%m-%d)

          echo "檢查自此日期起的 changes：$SINCE_DATE"

          # 取得 changed code files（排除 docs 本身）
          CHANGED_FILES=$(git log --since="$SINCE_DATE" --name-only --pretty=format: -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' \
            ':!*.test.*' ':!*.spec.*' ':!*.stories.*' \
            | sort -u | grep -v '^$' | head -100)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "過去 $DAYS_BACK 天沒有找到 code changes"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "找到 $(echo "$CHANGED_FILES" | wc -l) 個 changed files"
          fi

          echo "since_date=$SINCE_DATE" >> $GITHUB_OUTPUT

      - name: Claude Documentation Sync
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 60
          base_branch: main
          branch_prefix: claude/docs-sync-
          track_progress: true
          prompt: |
            # 每月 Documentation Sync

            你正在執行排程的 documentation sync。自 ${{ steps.check-changes.outputs.since_date }} 起，code 已有 changes。

            ## Changed Files
            以下 code files 已被修改：
            ```
            ${{ steps.check-changes.outputs.changed_files }}
            ```

            ## 你的任務

            1. **分析 Changes**：Review changed files，了解新增、修改或移除了哪些 functionality。

            2. **尋找相關 Documentation**：搜尋可能受影響的文件：
               - `/docs/` directory
               - README.md files
               - Code 中的 TSDoc comments

            3. **檢查真正的問題**：針對每個 code change，判斷現有 docs 是否已經錯誤：
               - Code examples 還能運作嗎？
               - API signatures/types 是否已不正確？
               - Prop interfaces 是否過期？

            4. **只修壞掉的內容**：如果找到真的錯誤：
               - 修正不正確的 code examples
               - 更新錯誤的 API signatures 與 types
               - 只有重大新功能完全沒有文件時，才新增 docs

            5. **建立 PR**：如果有修改：
               - 從 main 建立新 branch
               - Commit 所有 documentation updates
               - 建立 PR，摘要修正內容

            ## 關鍵 Guidelines
            - Documentation 是 LIVING DOCUMENT，只修真正錯誤的內容
            - 不要加入 changelog-style entries
            - 只有 docs 不正確或會誤導時才更新
            - 如果沒找到問題，回報結果且不要建立 PR
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*)"

      - name: 回報沒有 changes
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "過去 ${{ github.event.inputs.days_back || '30' }} 天沒有找到 code changes。"
          echo "略過 documentation sync。"
