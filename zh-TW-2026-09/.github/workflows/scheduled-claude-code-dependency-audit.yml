name: Scheduled - Dependency Audit

on:
  schedule:
    # 每月 1 日與 15 日 10:00 UTC
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 檢查 outdated dependencies
        id: check-outdated
        run: |
          npm outdated --json > /tmp/outdated.json 2>/dev/null || true
          if [ ! -s /tmp/outdated.json ] || [ "$(cat /tmp/outdated.json)" = "{}" ]; then
            echo "has_outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
            cat /tmp/outdated.json
          fi

      - name: Security audit
        id: security-audit
        run: |
          npm audit --json > /tmp/audit.json 2>/dev/null || true
          if [ -s /tmp/audit.json ]; then
            VULNERABILITIES=$(python3 -c "import json; d=json.load(open('/tmp/audit.json')); print(d.get('metadata',{}).get('vulnerabilities',{}).get('total',0))" 2>/dev/null || echo "0")
          else
            VULNERABILITIES=0
          fi
          echo "vulnerabilities=$VULNERABILITIES" >> "$GITHUB_OUTPUT"

      - name: Claude Dependency Analysis
        if: steps.check-outdated.outputs.has_outdated == 'true' || steps.security-audit.outputs.vulnerabilities != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/deps-update-
          track_progress: true
          prompt: |
            執行 dependency audit。

            1. 分析 npm outdated 與 npm audit。
            2. 優先安全的 patch/minor update。
            3. Major update 只有在 migration 風險可驗證時才進行。
            4. 每批 update 後執行 lint、typecheck、tests。
            5. 任何驗證失敗就還原該 update。
            6. 有安全且驗證通過的 change 才建立 PR，列出 old → new version 與修正的 vulnerability。
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*)"

      - name: 不需要更新
        if: steps.check-outdated.outputs.has_outdated == 'false' && steps.security-audit.outputs.vulnerabilities == '0'
        run: echo "Dependencies 已是最新且未發現 npm audit vulnerability。"
