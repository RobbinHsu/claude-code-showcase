name: Scheduled - Documentation Sync

on:
  schedule:
    # 每月 1 日 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: '往回檢查多少天的 changes'
        required: false
        default: '30'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 檢查期間內的 code changes
        id: check-changes
        run: |
          DAYS_BACK="${{ github.event.inputs.days_back || '30' }}"
          SINCE_DATE=$(date -d "-${DAYS_BACK} days" +%Y-%m-%d)

          CHANGED_FILES=$(git log --since="$SINCE_DATE" --name-only --pretty=format: -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' \
            ':!*.test.*' ':!*.spec.*' ':!*.stories.*' \
            | sort -u | grep -v '^$' | head -100)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          echo "since_date=$SINCE_DATE" >> "$GITHUB_OUTPUT"

      - name: Claude Documentation Sync
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/docs-sync-
          track_progress: true
          prompt: |
            執行每月 documentation sync。

            自 ${{ steps.check-changes.outputs.since_date }} 起變更的 files：
            ${{ steps.check-changes.outputs.changed_files }}

            任務：
            1. 理解 changes。
            2. 找出受影響的 docs / README / TSDoc。
            3. 只修正目前已錯誤、過期或會誤導的文件。
            4. 不製造 changelog 式文件。
            5. 有修改才建立 PR；沒有問題就直接回報。
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*)"

      - name: 沒有 changes
        if: steps.check-changes.outputs.has_changes == 'false'
        run: echo "指定期間沒有 code changes，略過 documentation sync。"
