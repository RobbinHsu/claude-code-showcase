name: Scheduled - Code Quality Review

on:
  schedule:
    # 每週日 08:00 UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      num_dirs:
        description: '要 review 的隨機目錄數'
        required: false
        default: '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  select-directories:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.select.outputs.directories }}
    steps:
      - uses: actions/checkout@v6

      - name: 選擇隨機 directories
        id: select
        run: |
          NUM_DIRS="${{ github.event.inputs.num_dirs || '3' }}"
          DIRS=$(find src -type d -exec sh -c 'ls "$1"/*.ts "$1"/*.tsx 2>/dev/null | grep -v -E "\.(test|spec|stories)\." | head -1' _ {} \; 2>/dev/null | \
            xargs -I {} dirname {} | sort -u | shuf -n "$NUM_DIRS")

          if [ -z "$DIRS" ]; then
            echo "directories=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON_DIRS=$(echo "$DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "directories=$JSON_DIRS" >> "$GITHUB_OUTPUT"

  review-directory:
    needs: select-directories
    if: needs.select-directories.outputs.directories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        directory: ${{ fromJson(needs.select-directories.outputs.directories) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Claude Code Quality Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/code-quality-
          track_progress: true
          prompt: |
            對 ${{ matrix.directory }} 執行聚焦的 code quality review。

            1. 讀取 .claude/agents/code-reviewer.md。
            2. Review 該 directory 的 source files，排除 generated / test / story files。
            3. 找 correctness、security、error handling、race condition、明顯 performance issue。
            4. 只修正明確且低風險的問題，不為 style 重構正常 code。
            5. 執行 npm run lint 與適用的 tests。
            6. 有實質修正才建立 PR。
          claude_args: |
            --max-turns 35
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*)"

  report-completion:
    needs: [select-directories, review-directory]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Code Quality Review 完成" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.select-directories.outputs.directories }}' | jq -r '.[]?' | while read dir; do
            echo "- \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
          done
